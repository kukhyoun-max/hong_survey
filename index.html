<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>홍보대사 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864; --accent:#2E74B5; --accent-light:#EAF1FB;
    --bg:#FAFAF8; --card:#FFFFFF; --text:#1B2430;
    --text-secondary:#6B7280; --text-muted:#9CA3AF; --border:#E5E7EB; --danger:#D64545;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; min-height:100vh;}
  .app{width:100%; max-width:420px; min-height:100vh; background:var(--card); display:flex; flex-direction:column; padding:24px 20px 28px;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .back-btn{background:none; border:none; padding:4px; cursor:pointer; color:var(--text-secondary); font-size:20px; line-height:1; visibility:hidden;}
  .back-btn.show{visibility:visible;}
  .progress-track{flex:1; height:4px; background:#EFEFEC; border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:var(--accent); border-radius:4px; transition:width .25s ease;}
  .progress-count{font-size:12px; color:var(--text-muted); min-width:40px; text-align:right;}
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .eyebrow{font-size:13px; font-weight:600; color:var(--accent); margin:0 0 10px;}
  .question{font-size:20px; font-weight:600; line-height:1.42; margin:0 0 22px; color:var(--text);}
  .hint{font-size:13px; color:var(--text-muted); margin:-14px 0 18px; line-height:1.5;}
  textarea, input[type="text"]{width:100%; font-family:inherit; font-size:16px; padding:14px; border:1.5px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); resize:none;}
  textarea:focus, input[type="text"]:focus{outline:none; border-color:var(--accent);}
  .field-label{font-size:13px; font-weight:600; color:var(--text-secondary); margin:14px 0 6px;}
  .field-label:first-child{margin-top:0;}
  .error-msg{display:none; font-size:13px; color:var(--danger); margin-top:8px;}
  .error-msg.show{display:block;}
  .scale-row{display:flex; gap:5px;}
  .scale-btn{flex:1; height:42px; border-radius:10px; border:1.5px solid var(--border); background:var(--card); font-size:13px; font-weight:500; color:var(--text); cursor:pointer; padding:0;}
  .scale-btn.selected{background:var(--accent-light); border-color:var(--accent); color:var(--navy);}
  .scale-row.small .scale-btn{height:36px; font-size:12px;}
  .scale-caption{display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-top:8px;}
  .group-row{padding:12px 0; border-bottom:1px solid var(--border);}
  .group-row:last-child{border-bottom:none;}
  .group-label{display:flex; justify-content:space-between; font-size:13px; font-weight:500; margin-bottom:8px; gap:8px;}
  .group-label span:last-child{text-align:right;}
  .group-wrap{max-height:56vh; overflow-y:auto;}
  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-grid.single-col{grid-template-columns:1fr;}
  .choice-btn{position:relative; padding:14px 12px; border-radius:12px; border:1.5px solid var(--border); background:var(--card); font-size:14px; font-weight:500; color:var(--text); cursor:pointer; text-align:left; line-height:1.45; white-space:pre-line;}
  .choice-btn.selected{background:var(--accent-light); border-color:var(--accent); color:var(--navy);}
  .choice-btn.least{background:#FBECEC; border-color:var(--danger); color:#8A2A2A;}
  .rank-badge{position:absolute; top:6px; right:8px; font-size:11px; font-weight:600; color:var(--accent);}
  .ml-title{font-size:13px; font-weight:600; color:var(--text-secondary); margin:16px 0 8px;}
  .ml-title:first-child{margin-top:0;}
  .grid-table{width:100%; border-collapse:separate; border-spacing:4px; font-size:13px;}
  .grid-table th{font-weight:500; color:var(--text-secondary);}
  .grid-cell{width:100%; height:36px; border-radius:8px; border:1.5px solid var(--border); background:var(--card); cursor:pointer;}
  .grid-cell.selected{background:var(--accent); border-color:var(--accent);}
  .next-btn{margin-top:22px; width:100%; height:52px; border-radius:12px; border:none; background:var(--navy); color:#fff; font-size:16px; font-weight:600; cursor:pointer;}
  .next-btn:disabled{background:#D8DCE3; cursor:default;}
  .intro-box{font-size:14.5px; line-height:1.7; color:var(--text);}
  .intro-box ul{padding-left:18px; margin:8px 0 0;}
  .consent-box{border:1.5px solid var(--border); border-radius:12px; background:var(--bg); padding:16px; font-size:13.5px; line-height:1.65; color:var(--text); margin-bottom:16px; max-height:46vh; overflow-y:auto;}
  .consent-box dl{margin:0;}
  .consent-box dt{font-weight:600; color:var(--navy); margin-top:10px;}
  .consent-box dt:first-child{margin-top:0;}
  .consent-box dd{margin:2px 0 0;}
  .consent-note{font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0 0 16px; padding:12px 14px; border-radius:10px; background:var(--accent-light);}
  .done-wrap{text-align:center; padding:20px 0;}
  .done-icon{width:56px; height:56px; border-radius:50%; background:var(--accent-light); color:var(--navy); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 20px;}
  .done-title{font-size:20px; font-weight:600; margin:0 0 8px;}
  .done-body{font-size:14px; color:var(--text-secondary); line-height:1.6; margin:0;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back-btn" id="backBtn" aria-label="이전">‹</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount"></span>
  </div>
  <div class="stage" id="stage"></div>
  <button class="next-btn" id="nextBtn">다음</button>
</div>

<script>
/* Apps Script 웹앱 URL — 「홍보대사 설문 v6 서버」(학교 계정). 기존 배포를 새 버전으로 올리면 URL은 그대로 유지돼요 */
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxE4tMac4f2Fo6EolWhyOFW6E5TcDf2PmmmEWYA1mriXWjJC9Os2wjq3AO5pZoLepUzvw/exec";
const VERSION = "v6";

/* 명단은 페이지에 두지 않아요. 담당자가 한 명씩 보내 준 참여 코드로 확인해요. */

const P1 = "1. 입학 이야기", P2 = "2. 나와 콘텐츠", P3 = "3. 팀 활동";
const NONE_HINT = "없으면 \"없음\"이라고 적어 주세요";
const NO_NAME_HINT = "다른 사람 이름은 쓰지 말아 주세요";

const opt = (...labels) => labels.map(l => ({ label:l, value:l }));
const CHANNELS = opt("전주대 공식 인스타그램","전주대 공식 유튜브","쇼츠·릴스·틱톡 추천 영상","학교 홈페이지·입학 안내","입시 커뮤니티·블로그","입시설명회·학과 체험·오픈캠퍼스","고등학교 선생님","친구·선배","가족");
const PARTS = ["기획(아이디어·구성)","촬영","편집","출연·진행(카메라 앞)","인터뷰 질문·섭외","자막·캡션 문구","썸네일·디자인","일정·소통 관리"];

/* ── 1. 입학 이야기·학교 인식 ── */
const part1 = [
  { key:"part1", type:"intro", eyebrow:P1, q:"전주대를 고르던 때 이야기부터 들려주세요",
    body:"고등학생 때 기억을 떠올리며 편하게 답해 주세요. 이 부분은 이름을 뺀 통계로 학교 홍보 방향을 정하는 데도 쓰여요." },
  { key:"cit", eyebrow:P1, q:"'전주대 가야겠다' 마음먹은 순간이 언제였나요?", hint:"그때 어디서 무엇을 보거나 듣고 있었는지 적어 주세요. 딱 떠오르는 순간이 없으면 '집이 가까워서'처럼 짧게 써도 괜찮아요. 성적·건강·가족 사정은 적지 않아도 돼요", type:"textarea", placeholder:"예: 고3 여름, 학과 소개 영상을 보다가 / 원서 쓰던 날 친구가 같이 가자고 해서" },
  { key:"citFeeling", eyebrow:P1, q:"그때 어떤 기분이었어요?", type:"text", placeholder:"한 문장으로 적어 주세요" },
  { key:"firstWhen", eyebrow:P1, q:"전주대를 처음 알게 된 건 언제였나요?", type:"choice", singleCol:true,
    options:opt("고1 전부터(원래 알고 있었음)","고1~고2","고3 1학기","고3 수시 원서 쓸 때","정시 원서 쓸 때 또는 그 이후") },
  { key:"firstChannel", eyebrow:P1, q:"처음 알게 된 경로는 어디에 가까운가요?", type:"choice", singleCol:true, allowOther:true,
    options:[...CHANNELS, ...opt("지역에서 원래 알고 있었음"), { label:"기타 (직접 입력)", value:"기타" }] },
  { key:"searched", eyebrow:P1, q:"원서 쓰기 전에 전주대 정보를 찾아본 곳을 모두 골라 주세요", type:"multi", singleCol:true,
    options:[...CHANNELS, ...opt("따로 찾아보지 않음")] },
  { key:"decision", eyebrow:P1, q:"전주대로 정하는 데 영향을 준 것을 중요한 순서대로 3개 골라 주세요", hint:"누른 순서대로 1·2·3위가 돼요", type:"rank", max:3, singleCol:true,
    options:opt("집·지역과 가까움","원하는 학과(다른 학교에 없는 학과)","취업·진로","장학금·등록금","캠퍼스·시설","학교 분위기·축제","주변 사람 추천","학교 SNS·유튜브 콘텐츠","기숙사·통학","기타") },
  { key:"compared", eyebrow:P1, q:"같이 고민한 학교가 있었다면 모두 골라 주세요", type:"multi", allowOther:true,
    options:[...opt("전북대","원광대","우석대","군산대","수도권 대학","전문대","고민한 학교 없음"), { label:"기타 (직접 입력)", value:"기타" }] },
  { key:"whyJJU", eyebrow:P1, q:"그 학교들 대신 전주대를 고른 이유를 한 줄로 적어 주세요", hint:NONE_HINT, type:"text", placeholder:"예: 가고 싶던 학과가 여기만 있어서" },
  { key:"remembered", eyebrow:P1, q:"원서 쓸 때 본 대학 콘텐츠 중 기억나는 게 있나요?", hint:"어느 학교든 괜찮아요. " + NONE_HINT, type:"textarea", placeholder:"예: ○○대 학과 소개 쇼츠, 재학생 브이로그" },
  { key:"helpfulFormat", eyebrow:P1, q:"수험생 때 가장 도움이 됐을 대학 콘텐츠를 2개까지 골라 주세요", type:"multi", max:2, singleCol:true,
    options:opt("학과 소개","재학생 하루 브이로그","캠퍼스 투어","입시 정보(전형·일정)","장학·등록금 안내","기숙사·통학 안내","축제·행사","재학생 인터뷰","밈·예능") },
  { key:"imageWord", eyebrow:P1, q:"전주대 하면 떠오르는 한 단어는?", type:"pair",
    fields:[{ key:"imageBefore", label:"입학 전", placeholder:"한 단어" }, { key:"imageNow", label:"지금", placeholder:"한 단어" }] },
  { key:"img", eyebrow:P1, q:"입학 전에 떠올린 전주대는 어느 쪽에 가까웠나요?", hint:"가운데(4)는 '보통'이에요", type:"bipolar",
    rows:[["imgActive","차분한","활동적인"],["imgUnique","평범한","개성 있는"],["imgChallenge","안정적인","도전적인"],["imgSocial","조용한","사교적인"],
          ["imgStylish","촌스러운","세련된"],["imgFriendly","딱딱한","친근한"],["imgFun","지루한","재밌는"]] },
  { key:"afterJoin", eyebrow:P1, q:"입학하고 나서 느낀 점을 적어 주세요", hint:NONE_HINT, type:"pair", multiline:true,
    fields:[{ key:"goodAfter", label:"생각보다 좋았던 점", placeholder:"예: 캠퍼스가 넓고 시설이 좋음" }, { key:"regretAfter", label:"아쉬웠던 점", placeholder:"자유롭게" }] },
  { key:"recommend", eyebrow:P1, q:"고등학생 후배에게 전주대를 추천한다면 몇 점인가요?", type:"scale", min:0, maxv:10, left:"추천 안 함", right:"꼭 추천", reason:true, reasonPlaceholder:"그렇게 생각한 이유 한 줄" },
  { key:"follow", eyebrow:P1, q:"지금 전주대 공식 인스타그램·유튜브를 보고 있나요?", type:"choice", singleCol:true, reason:true, reasonPlaceholder:"자주 보는(또는 보고 싶은) 콘텐츠 한 줄",
    options:opt("둘 다 팔로우·구독","인스타그램만","유튜브만","둘 다 안 함") },
];

/* ── 2. 나와 콘텐츠 ── */
const part2 = [
  { key:"part2", type:"intro", eyebrow:P2, q:"이제 나에 대해 알려주세요",
    body:"맡고 싶은 파트와 잘 맞는 콘텐츠를 정하는 데 써요. 잘하는 것보다 솔직한 답이 더 도움이 돼요." },
  { key:"self", eyebrow:P2, q:"나는 어느 쪽에 가까운가요?", hint:"가운데(4)는 '반반'이에요", type:"bipolar",
    rows:[["selfActive","차분한","활동적인"],["selfUnique","평범한","개성 있는"],["selfChallenge","안정적인","도전적인"],["selfSocial","조용한","사교적인"],
          ["selfPlan","계획을 세우고 움직인다","일단 해 보며 맞춘다"],["selfLead","앞에서 이끈다","뒤에서 받쳐 준다"],
          ["selfDetail","큰 그림을 본다","디테일을 챙긴다"],["selfDeadline","마감 한참 전에 끝낸다","마감 직전에 몰아서 한다"]] },
  { key:"interests", eyebrow:P2, q:"SNS에서 즐겨 보는 주제를 3개까지 골라 주세요", type:"multi", max:3,
    options:opt("운동·스포츠","맛집·카페","먹방","패션·뷰티","음악·공연","아이돌·연예","여행","게임","공부·자기계발","반려동물·일상","영화·드라마","기타") },
  { key:"accounts", eyebrow:P2, q:"자주 보는 계정이나 채널 3개를 적어 주세요", hint:"공개 계정·채널 이름만 적어 주세요", type:"text", placeholder:"예: ○○, △△, □□" },
  { key:"tone", eyebrow:P2, q:"내가 편한 콘텐츠 톤을 1·2순위로 골라 주세요", hint:"누른 순서대로 1·2순위가 돼요", type:"rank", max:2,
    options:opt("감성","유머","정보전달","솔직토크") },
  { key:"formats", eyebrow:P2, q:"해 보고 싶은 콘텐츠 형식을 모두 골라 주세요", type:"multi",
    options:opt("릴스·쇼츠","브이로그(긴 영상)","인터뷰","체험·도전","정보 카드뉴스","챌린지·밈","웹드라마·연기") },
  { key:"partWant", eyebrow:P2, q:"홍보대사 활동에서 맡고 싶은 파트를 1·2순위로 골라 주세요", hint:"누른 순서대로 1·2순위가 돼요", type:"rank", max:2, singleCol:true, options:opt(...PARTS) },
  { key:"conf", eyebrow:P2, q:"파트별로 지금 얼마나 자신 있나요?", type:"scaleGroup", min:1, maxv:5, left:"자신 없음", right:"자신 있음",
    rows:PARTS.map((p, i) => ["conf" + (i + 1), p]) },
  { key:"experience", eyebrow:P2, q:"해 본 적 있는 것을 모두 골라 주세요", type:"multi", singleCol:true,
    options:opt("숏폼을 편집해서 올려 봄","브이로그를 찍어 봄","인터뷰를 진행해 봄","팀 프로젝트 리더를 해 봄","포스터·카드뉴스를 만들어 봄","해 본 것 없음") },
  { key:"onCamera", eyebrow:P2, q:"콘텐츠 출연은 어디까지 편한가요?", hint:"언제든 바꿀 수 있어요. 출연 전에는 항상 다시 물어볼게요", type:"choice", singleCol:true,
    options:opt("얼굴·목소리 모두 괜찮아요","목소리만 괜찮아요","손·뒷모습만 괜찮아요","출연은 안 하고 싶어요") },
  { key:"interviewComfort", eyebrow:P2, q:"처음 보는 사람에게 말 걸고 인터뷰하는 건 어때요?", type:"scale", min:1, maxv:5, left:"어렵다", right:"재밌다" },
  { key:"tools", eyebrow:P2, q:"쓸 줄 아는 편집·디자인 도구를 모두 골라 주세요", type:"multi",
    options:opt("CapCut","VLLO","프리미어 프로","파이널컷","캔바·미리캔버스","포토샵·일러스트","없음") },
  { key:"gear", eyebrow:P2, q:"촬영에 쓸 수 있는 장비를 모두 골라 주세요", type:"multi",
    options:opt("4K 촬영 되는 휴대폰","짐벌","무선 마이크","카메라","삼각대","없음") },
  { key:"storyAccess", eyebrow:P2, q:"내가 남보다 잘 알려 줄 수 있는 전주대 이야기가 있나요?", hint:"우리 학과 수업·실습, 동아리, 생활 꿀팁, 숨은 장소 등. " + NO_NAME_HINT, type:"textarea", placeholder:"예: 한식조리 실습실 하루, 기숙사 꿀팁" },

function esc(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
const declined = () => answers.consent === '미동의' || answers.transfer === '미동의';

function buildSteps(){
  const head = [codeStep, introStep, consentStep, transferStep];
  if(!verified){ steps = [codeStep]; return; }
  if(declined()){ steps = head.slice(0, answers.consent === '미동의' ? 3 : 4); return; }
  steps = [...head, ...bodySteps];
}

function choiceButtons(s, isSelected, extra){
  return s.options.map(o => {
    const badge = extra ? extra(o) : '';
    return `<button type="button" class="choice-btn ${isSelected(o) ? 'selected' : ''}" data-value="${esc(o.value)}">${esc(o.label)}${badge}</button>`;
  }).join('');
}
function scaleButtons(key, min, maxv, small){
  let btns = '';
  for(let i = min; i <= maxv; i++){
    btns += `<button type="button" class="scale-btn ${answers[key] === i ? 'selected' : ''}" data-key="${key}" data-value="${i}">${i}</button>`;
  }
  return `<div class="scale-row ${small ? 'small' : ''}">${btns}</div>`;
}

function render(){
  const s = steps[current];
  const total = verified && !declined() ? steps.length : 0;
  progressFill.style.width = total ? Math.round(((current + 1) / total) * 100) + '%' : '4%';
  progressCount.textContent = total ? (current + 1) + '/' + total : '';
  backBtn.classList.toggle('show', current > 0);
  nextBtn.disabled = false;
  nextBtn.style.display = '';
  const isLast = verified && current === steps.length - 1;
  nextBtn.textContent = isLast ? '제출하기' : '다음';

  let bodyHtml = '';
  if(s.type === 'intro'){
    const who = (s.key === 'intro' && respondent) ? `<p class="consent-note">${esc(respondent)}님, 안녕하세요. 본인이 아니면 창을 닫고 담당자에게 알려 주세요.</p>` : '';
    bodyHtml = `${who}<div class="intro-box">${s.body}</div>`;
  } else if(s.type === 'consent'){
    bodyHtml = `
      <div class="consent-box">${s.html}</div>
      <p class="consent-note">${s.note}</p>
      <div class="choice-grid single-col" id="input">
        <button type="button" class="choice-btn ${answers[s.key]==='동의'?'selected':''}" data-value="동의">동의합니다</button>
        <button type="button" class="choice-btn ${answers[s.key]==='미동의'?'selected':''}" data-value="미동의">동의하지 않습니다</button>
      </div>`;
  } else if(s.type === 'text'){
    bodyHtml = `<input type="text" id="input" placeholder="${esc(s.placeholder)}" value="${esc(answers[s.key])}" autocomplete="off"/>`;
  } else if(s.type === 'textarea'){
    bodyHtml = `<textarea id="input" rows="5" placeholder="${esc(s.placeholder)}">${esc(answers[s.key])}</textarea>`;
  } else if(s.type === 'pair'){
    bodyHtml = s.fields.map(f => `<p class="field-label">${f.label}</p>` + (s.multiline
      ? `<textarea class="pair-input" data-key="${f.key}" rows="3" placeholder="${esc(f.placeholder)}">${esc(answers[f.key])}</textarea>`
      : `<input type="text" class="pair-input" data-key="${f.key}" placeholder="${esc(f.placeholder)}" value="${esc(answers[f.key])}" autocomplete="off"/>`)).join('');
  } else if(s.type === 'scale'){
    bodyHtml = scaleButtons(s.key, s.min, s.maxv) + `<div class="scale-caption"><span>${s.left}</span><span>${s.right}</span></div>`;
  } else if(s.type === 'bipolar'){
    bodyHtml = `<div class="group-wrap">` + s.rows.map(([k, l, r]) =>
      `<div class="group-row"><div class="group-label"><span>${l}</span><span>${r}</span></div>${scaleButtons(k, 1, 7, true)}</div>`).join('') + `</div>`;
  } else if(s.type === 'scaleGroup'){
    bodyHtml = `<div class="scale-caption" style="margin:0 0 4px;"><span>1 = ${s.left}</span><span>${s.maxv} = ${s.right}</span></div><div class="group-wrap">` +
      s.rows.map(([k, l]) => `<div class="group-row"><div class="group-label"><span>${l}</span></div>${scaleButtons(k, s.min, s.maxv, true)}</div>`).join('') + `</div>`;
  } else if(s.type === 'choice'){
    bodyHtml = `<div class="choice-grid ${s.singleCol ? 'single-col' : ''}" id="input">${choiceButtons(s, o => answers[s.key] === o.value)}</div>`;
  } else if(s.type === 'multi'){
    const cur = answers[s.key] || [];
    bodyHtml = `<div class="choice-grid ${s.singleCol ? 'single-col' : ''}" id="input">${choiceButtons(s, o => cur.includes(o.value))}</div>`;
  } else if(s.type === 'rank'){
    const cur = answers[s.key] || [];
    bodyHtml = `<div class="choice-grid ${s.singleCol ? 'single-col' : ''}" id="input">${choiceButtons(s, o => cur.includes(o.value),
      o => cur.includes(o.value) ? `<span class="rank-badge">${cur.indexOf(o.value) + 1}위</span>` : '')}</div>`;
  } else if(s.type === 'mostLeast'){
    const most = answers[s.key + 'Most'], least = answers[s.key + 'Least'];
    const block = (title, which, val) => `<p class="ml-title">${title}</p><div class="choice-grid single-col" data-which="${which}">` +
      s.options.map(o => `<button type="button" class="choice-btn ${val === o.value ? (which === 'Least' ? 'least' : 'selected') : ''}" data-value="${esc(o.value)}">${esc(o.label)}</button>`).join('') + `</div>`;
    bodyHtml = block('내가 가장 할 것 같은 행동', 'Most', most) + block('내가 가장 안 할 것 같은 행동', 'Least', least);
  } else if(s.type === 'grid'){
    const cur = answers[s.key] || [];
    bodyHtml = `<table class="grid-table"><tr><th></th>${s.cols.map(c => `<th>${c}</th>`).join('')}</tr>` +
      s.rowsLabel.map(r => `<tr><th>${r}</th>${s.cols.map(c => {
        const v = r + ' ' + c;
        return `<td><button type="button" class="grid-cell ${cur.includes(v) ? 'selected' : ''}" data-value="${v}" aria-label="${v}"></button></td>`;
      }).join('')}</tr>`).join('') + `</table>`;
  }
  if(s.allowOther){
    const other = s.type === 'multi' ? (answers[s.key] || []).includes('기타') : answers[s.key] === '기타';
    bodyHtml += `<input type="text" id="otherInput" placeholder="직접 입력해 주세요" value="${esc(answers[s.key + 'Other'])}" style="margin-top:10px; display:${other ? 'block' : 'none'};"/>`;
  }
  if(s.reason){
    bodyHtml += `<input type="text" id="reasonInput" placeholder="${esc(s.reasonPlaceholder || '이유 한 줄')}" value="${esc(answers[s.key + 'Reason'])}" style="margin-top:12px;"/>`;
  }

  const hintHtml = s.hint ? `<p class="hint">${s.hint}</p>` : '';
  stage.innerHTML = `
    <p class="eyebrow">${s.eyebrow}</p>
    <p class="question">${s.q}</p>
    ${hintHtml}
    ${bodyHtml}
    <p class="error-msg" id="errorMsg">${errorText(s)}</p>
  `;
  attachHandlers(s);
}

function errorText(s){
  if(s.type === 'bipolar' || s.type === 'scaleGroup') return '모든 줄에 답해 주세요';
  if(s.type === 'rank') return s.max + '개를 순서대로 골라 주세요';
  if(s.type === 'mostLeast') return '두 가지를 서로 다르게 골라 주세요';
  return '답변을 선택하거나 입력해 주세요';
}

function attachHandlers(s){
  const errorMsg = document.getElementById('errorMsg');
  const clear = () => errorMsg.classList.remove('show');
  const toggleOther = show => { const el = document.getElementById('otherInput'); if(el){ el.style.display = show ? 'block' : 'none'; if(show) el.focus(); } };

  if(s.type === 'choice' || s.type === 'consent'){
    stage.querySelectorAll('#input button').forEach(btn => btn.addEventListener('click', () => {
      stage.querySelectorAll('#input button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      answers[s.key] = btn.dataset.value;
      clear();
      if(s.allowOther) toggleOther(btn.dataset.value === '기타');
      if(s.type === 'consent'){ buildSteps(); render(); }
    }));
  } else if(s.type === 'multi' || s.type === 'rank'){
    stage.querySelectorAll('#input button').forEach(btn => btn.addEventListener('click', () => {
      const cur = answers[s.key] || (answers[s.key] = []);
      const v = btn.dataset.value, i = cur.indexOf(v);
      if(i >= 0) cur.splice(i, 1);
      else if(!s.max || cur.length < s.max) cur.push(v);
      clear();
      render();
    }));
  } else if(s.type === 'scale' || s.type === 'bipolar' || s.type === 'scaleGroup'){
    stage.querySelectorAll('.scale-btn').forEach(btn => btn.addEventListener('click', () => {
      const k = btn.dataset.key;
      btn.parentElement.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      answers[k] = Number(btn.dataset.value);
      clear();
    }));
  } else if(s.type === 'mostLeast'){
    stage.querySelectorAll('[data-which] button').forEach(btn => btn.addEventListener('click', () => {
      answers[s.key + btn.parentElement.dataset.which] = btn.dataset.value;
      clear();
      render();
    }));
  } else if(s.type === 'grid'){
    stage.querySelectorAll('.grid-cell').forEach(btn => btn.addEventListener('click', () => {
      const cur = answers[s.key] || (answers[s.key] = []);
      const i = cur.indexOf(btn.dataset.value);
      if(i >= 0) cur.splice(i, 1); else cur.push(btn.dataset.value);
      btn.classList.toggle('selected');
      clear();
    }));
  } else if(s.type === 'pair'){
    stage.querySelectorAll('.pair-input').forEach(el => el.addEventListener('input', () => { answers[el.dataset.key] = el.value; clear(); }));
  } else if(s.type === 'text' || s.type === 'textarea'){
    const el = document.getElementById('input');
    el.addEventListener('input', clear);
  }
  ['otherInput','reasonInput'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => { answers[s.key + (id === 'otherInput' ? 'Other' : 'Reason')] = el.value; clear(); });
  });
}

function filled(v){ return v !== undefined && v !== null && String(v).trim() !== ''; }

function validate(s){
  if(s.type === 'intro') return true;
  if(s.type === 'text' || s.type === 'textarea'){
    const val = document.getElementById('input').value.trim();
    if(!val) return false;
    answers[s.key] = s.key === 'code' ? val.toUpperCase().replace(/\s/g, '') : val;
    return true;
  }
  if(s.type === 'pair') return s.fields.every(f => filled(answers[f.key]));
  if(s.type === 'bipolar' || s.type === 'scaleGroup') return s.rows.every(r => filled(answers[r[0]]));
  if(s.type === 'mostLeast'){
    const m = answers[s.key + 'Most'], l = answers[s.key + 'Least'];
    return filled(m) && filled(l) && m !== l;
  }
  if(s.type === 'rank') return (answers[s.key] || []).length === s.max;
  if(s.type === 'multi' || s.type === 'grid'){
    const cur = answers[s.key] || [];
    if(!cur.length) return false;
    if(s.allowOther && cur.includes('기타') && !filled(answers[s.key + 'Other'])) return false;
    return true;
  }
  if(s.allowOther && answers[s.key] === '기타' && !filled(answers[s.key + 'Other'])) return false;
  if(s.reason && !filled(answers[s.key + 'Reason'])) return false;
  return filled(answers[s.key]);
}

/* 참여 코드 확인: 서버가 코드에 맞는 이름과 제출 여부를 알려 줘요 (다른 사람 이름은 조회할 수 없어요) */
function checkCode(code){
  nextBtn.disabled = true;
  nextBtn.textContent = '확인 중...';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  return fetch(ENDPOINT_URL + '?action=status&v=' + VERSION + '&code=' + encodeURIComponent(code), { signal: ctrl.signal })
    .then(r => r.json())
    .then(st => {
      clearTimeout(timer);
      if(st.open === false){ showMessage('응답 기간이 끝났어요', '설문 응답이 마감됐어요. 궁금한 점은 담당자에게 문의해 주세요.'); return 'stop'; }
      if(!st.valid){ return 'invalid'; }
      if(st.done){ showMessage('이미 제출했어요', (st.round ? '이번 ' + st.round + '회차 ' : '') + '응답이 이미 저장돼 있어요. 수정이나 삭제가 필요하면 담당자에게 알려 주세요.'); return 'stop'; }   // 같은 회차만 1회 (서버 SURVEY_ROUND, 2026-10-30)
      respondent = st.name || '';
      return 'ok';
    })
    .catch(() => { clearTimeout(timer); return 'error'; });
}

nextBtn.addEventListener('click', async () => {
  const s = steps[current];
  if(!validate(s)){ document.getElementById('errorMsg').classList.add('show'); return; }

  if(s.key === 'code'){
    const res = await checkCode(answers.code);
    if(res === 'stop') return;
    if(res !== 'ok'){
      render();
      const err = document.getElementById('errorMsg');
      err.textContent = res === 'invalid' ? '코드를 다시 확인해 주세요' : '연결이 잠시 불안정해요. 잠시 뒤 다시 눌러 주세요';
      err.classList.add('show');
      return;
    }
    verified = true;
  }

  buildSteps();
  if(current < steps.length - 1){ current++; render(); window.scrollTo(0, 0); } else { submit(); }
});
backBtn.addEventListener('click', () => {
  if(current > 0){
    current--;
    if(steps[current].key === 'code'){ verified = false; respondent = ''; delete answers.consent; delete answers.transfer; buildSteps(); }
    render();
  }
});

/* 제출 형식: fields = [{k, label, v}] (서버가 k 기준으로 열을 맞춰요) */
function collect(){
  const fields = [];
  const add = (k, label, v) => fields.push({ k, label, v: Array.isArray(v) ? v.join(', ') : (v ?? '') });
  bodySteps.forEach(s => {
    if(s.type === 'intro') return;
    const q = s.q;
    if(s.type === 'pair') s.fields.forEach(f => add(f.key, q + ' - ' + f.label, answers[f.key]));
    else if(s.type === 'bipolar') s.rows.forEach(([k, l, r]) => add(k, l + ' ↔ ' + r + ' (1~7)', answers[k]));
    else if(s.type === 'scaleGroup') s.rows.forEach(([k, l]) => add(k, '자신감 - ' + l + ' (1~5)', answers[k]));
    else if(s.type === 'mostLeast'){ add(s.key + 'Most', q + ' - 가장 할 것', answers[s.key + 'Most']); add(s.key + 'Least', q + ' - 가장 안 할 것', answers[s.key + 'Least']); }
    else if(s.type === 'rank') add(s.key, q, (answers[s.key] || []).map((v, i) => (i + 1) + ')' + v));
    else {
      let v = answers[s.key];
      if(s.allowOther && filled(answers[s.key + 'Other'])){
        v = Array.isArray(v) ? v.map(x => x === '기타' ? '기타: ' + answers[s.key + 'Other'] : x) : (v === '기타' ? '기타: ' + answers[s.key + 'Other'] : v);
      }
      add(s.key, q, v);
    }
    if(s.reason) add(s.key + 'Reason', q + ' - 이유', answers[s.key + 'Reason']);
  });
  return fields;
}

function submit(){
  nextBtn.disabled = true;
  nextBtn.textContent = '저장 중...';
  const payload = { v: VERSION, code: answers.code, consent: answers.consent || '', transfer: answers.transfer || '' };
  if(!declined()) payload.fields = collect();

  fetch(ENDPOINT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  }).then(r => r.json()).then(res => {
    if(res && res.ok === false && res.error === 'done'){ showMessage('이미 제출했어요', (res.round ? '이번 ' + res.round + '회차 ' : '') + '응답이 이미 저장돼 있어요. 수정이나 삭제가 필요하면 담당자에게 알려 주세요.'); return; }
    // 저장 실패가 보이게(2026-10-30): 마감·코드 오류 등은 완료 화면 대신 알림
    if(res && res.ok === false){ showMessage('저장하지 못했어요', ({ closed:'응답 기간이 끝났어요.', code:'참여 코드를 다시 확인해 주세요.', version:'페이지를 새로고침한 뒤 다시 제출해 주세요.' }[res.error] || '잠시 후 다시 제출해 주세요.') + ' 계속 안 되면 담당자에게 알려 주세요.'); return; }
    showDone();
  }).catch(() => showMessage('제출을 확인하지 못했어요', '인터넷 연결을 확인하고 다시 제출해 주세요. 이미 저장됐다면 다시 낼 때 「이미 제출했어요」가 떠요.'));
}

function showMessage(title, body, icon){
  progressFill.style.width = '100%';
  progressCount.textContent = '';
  backBtn.classList.remove('show');
  nextBtn.style.display = 'none';
  stage.innerHTML = `
    <div class="done-wrap">
      <div class="done-icon">${icon || 'i'}</div>
      <p class="done-title">${title}</p>
      <p class="done-body">${body}</p>
    </div>`;
}

function showDone(){
  if(declined()){
    showMessage('선택이 저장됐어요', '동의하지 않으셨어요. 응답은 저장하지 않았고, 활동이나 평가에 불이익은 없어요.<br>마음이 바뀌면 담당자에게 알려 주세요.', '✓');
  } else {
    showMessage('응답이 저장됐어요', '긴 설문에 솔직하게 답해 줘서 고마워요.', '✓');
  }
}

/* 개인 링크(…/#c=코드)로 들어오면 코드 칸을 미리 채워요. # 뒤라서 서버 기록에 남지 않고, 주소창에서도 바로 지워요 */
(() => {
  const m = location.hash.match(/[#&]c=([A-Za-z0-9]{4,12})/);
  if(!m) return;
  answers.code = m[1].toUpperCase();
  history.replaceState(null, '', location.pathname + location.search);
})();

render();
</script>

</html>
